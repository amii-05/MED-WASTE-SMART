<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Used syringe</title>
  <desc id="desc">Illustration of a used syringe with an orange fluid filled barrel and exposed needle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <g transform="rotate(-30 200 150)">
    <!-- plunger finger grips -->
    <rect x="52" y="112" width="26" height="76" rx="8" fill="#64748b"/>
    <!-- plunger rod -->
    <rect x="78" y="134" width="52" height="32" rx="6" fill="#94a3b8"/>
    <!-- barrel -->
    <rect x="128" y="118" width="152" height="64" rx="10" fill="url(#barrel)" stroke="#94a3b8" stroke-width="3"/>
    <!-- fluid inside -->
    <rect x="196" y="124" width="74" height="52" rx="8" fill="#f97316" opacity="0.85"/>
    <!-- measurement marks -->
    <g stroke="#64748b" stroke-width="3">
      <line x1="150" y1="126" x2="150" y2="138"/>
      <line x1="174" y1="126" x2="174" y2="138"/>
    </g>
    <!-- needle hub -->
    <rect x="280" y="126" width="22" height="48" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
    <!-- needle -->
    <line x1="302" y1="150" x2="368" y2="150" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
