<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Soiled gauze and bandages</title>
  <desc id="desc">Illustration of rolled bandages and a soiled gauze pad with a stain.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- rolled bandage left -->
  <g>
    <circle cx="120" cy="150" r="52" fill="#e2e8f0" stroke="#94a3b8" stroke-width="4"/>
    <path d="M 120 150 a 38 38 0 1 1 -0.1 0" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="120" cy="150" r="16" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  </g>
  <!-- rolled bandage right -->
  <g>
    <circle cx="290" cy="150" r="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="290" cy="150" r="12" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  </g>
  <!-- soiled gauze pad -->
  <g transform="rotate(-12 205 205)">
    <rect x="150" y="180" width="110" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
    <g opacity="0.85">
      <ellipse cx="205" cy="210" rx="18" ry="12" fill="#b91c1c"/>
      <ellipse cx="198" cy="206" rx="9" ry="6" fill="#dc2626"/>
    </g>
    <g stroke="#e2e8f0" stroke-width="2">
      <line x1="160" y1="190" x2="175" y2="190"/>
      <line x1="160" y1="230" x2="175" y2="230"/>
      <line x1="245" y1="190" x2="250" y2="190"/>
    </g>
  </g>
</svg>
