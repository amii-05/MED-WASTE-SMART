<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="title desc">
  <title id="title">General refuse (non-clinical)</title>
  <desc id="desc">Illustration of a general waste bin with crumpled paper and a lid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- bin body -->
  <path d="M 130 110 L 270 110 L 258 265 Q 256 275 244 275 L 156 275 Q 144 275 142 265 Z" fill="#94a3b8" stroke="#64748b" stroke-width="4"/>
  <!-- lid -->
  <path d="M 118 96 Q 200 78 282 96 L 272 116 Q 200 96 128 116 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="4"/>
  <!-- recycle symbol on bin -->
  <g transform="translate(200 190) scale(1.0)">
    <g stroke="#e2e8f0" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -18 L 15 9 L -15 9 Z"/>
      <path d="M 14 9 L 5 30 L -14 -5 Z"/>
      <path d="M -14 -5 L -18 11 L 14 11 Z"/>
    </g>
  </g>
  <!-- crumpled paper sticking out -->
  <path d="M 175 70 L 185 108" fill="none" stroke="#ffffff" stroke-width="6"/>
  <path d="M 195 60 L 210 104" fill="none" stroke="#f8fafc" stroke-width="6"/>
  <circle cx="192" cy="64" r="10" fill="#f8fafc"/>
</svg>
